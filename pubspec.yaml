name: flutter_js_runtime
description: A Javascript engine to use with flutter.
  It uses Quickjs on Android and JavascriptCore on IOS
version: 0.8.7
homepage: https://github.com/abner/flutter_js
repository: https://github.com/abner/flutter_js

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.0.0
  http: ^1.0.0
  sync_http: ^0.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.github.wooseongg.flutter_js_runtime
        pluginClass: FlutterJsRuntimePlugin
      ios:
        pluginClass: FlutterJsRuntimePlugin
      linux:
        pluginClass: FlutterJsRuntimePlugin
      macos:
        pluginClass: FlutterJsRuntimePlugin
      windows:
        pluginClass: FlutterJsRuntimePlugin

  assets:
    - assets/js/
