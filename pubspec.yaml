name: flutter_js_runtime
description: >-
  Run JavaScript in Flutter apps. Uses QuickJS on Android, Windows and Linux,
  and JavaScriptCore on iOS and macOS.
version: 0.9.0
homepage: https://github.com/WooSeongg/flutter_js_runtime
repository: https://github.com/WooSeongg/flutter_js_runtime
issue_tracker: https://github.com/WooSeongg/flutter_js_runtime/issues
topics: [javascript, js-engine, quickjs, javascriptcore, ffi]

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.0.0
  http: ^1.0.0
  sync_http: ^0.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.github.wooseongg.flutter_js_runtime
        pluginClass: FlutterJsRuntimePlugin
      ios:
        pluginClass: FlutterJsRuntimePlugin
      linux:
        pluginClass: FlutterJsRuntimePlugin
      macos:
        pluginClass: FlutterJsRuntimePlugin
      windows:
        pluginClass: FlutterJsRuntimePlugin

  assets:
    - assets/js/
